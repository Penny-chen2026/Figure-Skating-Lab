<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skate Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=Noto+Sans+KR:wght@400;500;600;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1622; --panel:#101F31; --panel-2:#152A41; --line: rgba(148,190,214,0.18);
    --ice:#5FD3E8; --ice-dim: rgba(95,211,232,0.14); --amber:#F2A65A; --amber-dim: rgba(242,166,90,0.16);
    --coral:#FF6F6F; --coral-dim: rgba(255,111,111,0.15); --good:#7BD88F; --text:#EAF2F6; --text-dim:#93A9BC;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--ink);
    background-image: radial-gradient(ellipse at 10% -10%, rgba(95,211,232,0.10), transparent 45%), radial-gradient(ellipse at 100% 0%, rgba(242,166,90,0.06), transparent 40%);
    color:var(--text); font-family:'Noto Sans SC','Noto Sans KR', -apple-system, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Manrope','Noto Sans SC',sans-serif;}
  a{color:inherit;} button{font-family:inherit;}
  .app{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 22px;max-width:920px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px;}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ice),#2E8FA8);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(95,211,232,0.25);}
  .logo{display:inline-flex;align-items:flex-end;font-family:'Manrope','Noto Sans SC',sans-serif;font-weight:800;color:#4DA3FF;line-height:1;letter-spacing:-.3px;font-size:22px;}
  .logo .skate-l{height:1.12em;width:auto;margin:0 .03em -.2em;}
  .logo-xl{margin:0 0 10px;}
  .logo-xl .logo{font-size:44px;}
  .brand .sub{font-size:11px;color:var(--text-dim);font-weight:500;}
  .userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  .avatar-badge{width:30px;height:30px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .logout-btn,.langswitch-btn{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
  .logout-btn:hover,.langswitch-btn:hover{color:var(--text);border-color:var(--ice);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}

  /* lang select */
  .lang-wrap{display:flex;flex-direction:column;align-items:center;padding-top:10vh;}
  .lang-hero{text-align:center;margin-bottom:30px;}
  .lang-hero .mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--ice),#2E8FA8);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(95,211,232,0.25);}
  .lang-hero h1{font-size:20px;margin:0 0 6px;}
  .lang-hero p{color:var(--text-dim);font-size:13px;margin:0;}
  .lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;}
  .lang-opt{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px 14px;cursor:pointer;text-align:left;}
  .lang-opt:hover{border-color:var(--ice);}
  .lang-opt .native{font-size:15px;font-weight:700;}
  .lang-opt .eng{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

  /* Auth */
  .auth-wrap{display:flex;flex-direction:column;align-items:center;padding-top:6vh;}
  .auth-hero{text-align:center;margin-bottom:26px;max-width:440px;}
  .auth-hero h1{font-size:24px;line-height:1.35;margin:0 0 8px;font-weight:700;}
  .auth-hero p{color:var(--text-dim);font-size:14px;line-height:1.7;margin:0;}
  .auth-card{width:100%;max-width:400px;}
  .tabs{display:flex;background:var(--panel-2);border-radius:10px;padding:4px;margin-bottom:20px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-dim);transition:.15s;}
  .tab.active{background:var(--ice);color:#06232B;}
  label{display:block;font-size:12.5px;color:var(--text-dim);margin:0 0 6px;font-weight:500;}
  .field{margin-bottom:14px;}
  input[type=email],input[type=password],input[type=text],input[type=number],select,textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--ice);box-shadow:0 0 0 3px var(--ice-dim);}
  .primary-btn{width:100%;background:linear-gradient(135deg,var(--ice),#3FB6CC);color:#06232B;border:none;padding:12px 0;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px;}
  .primary-btn:active{transform:translateY(1px);}
  .ghost-btn{background:none;border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .ghost-btn:hover{border-color:var(--ice);}
  .err-msg{background:var(--coral-dim);color:#FFB3B3;border:1px solid rgba(255,111,111,0.35);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none;}
  .err-msg.show{display:block;}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:16px;text-align:center;line-height:1.6;}

  /* Onboarding */
  .onb-progress{display:flex;gap:6px;margin-bottom:22px;}
  .onb-progress i{flex:1;height:3px;border-radius:2px;background:var(--line);}
  .onb-progress i.on{background:var(--ice);}
  .onb-step h2{font-size:19px;margin:0 0 4px;}
  .onb-step p.sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  .choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px;}
  .choice{border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:14px 10px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text-dim);}
  .choice.sel{border-color:var(--ice);background:var(--ice-dim);color:var(--ice);}
  .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:6px;}
  .avatar-opt{aspect-ratio:1;border-radius:50%;background:var(--panel-2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
  .avatar-opt.sel{border-color:var(--ice);background:var(--ice-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .onb-nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}

  /* Dashboard */
  .hello{margin-bottom:4px;font-size:22px;font-weight:700;}
  .hello .em{color:var(--ice);}
  .datestr{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px;}
  .section-title h3{font-size:16px;margin:0;font-weight:700;}
  .section-title span{font-size:12px;color:var(--text-dim);}
  .goal-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .goal-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);}
  .goal-item:first-child{border-top:none;padding-top:0;}
  .goal-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:transparent;}
  .goal-check.done{background:var(--good);border-color:var(--good);color:#06231A;}
  .goal-body b{font-size:14px;font-weight:600;}
  .goal-body p{margin:3px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.6;}
  .goal-tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;margin-top:6px;font-weight:600;}
  .tag-warm{background:var(--amber-dim);color:var(--amber);}
  .tag-strength{background:var(--ice-dim);color:var(--ice);}
  .tag-recover{background:rgba(123,216,143,0.15);color:var(--good);}
  .tag-safety{background:var(--coral-dim);color:#FF9B9B;}
  .goal-progress{font-size:12px;color:var(--text-dim);margin-top:14px;}
  .vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .vid-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .vid-thumb{height:88px;background:linear-gradient(135deg,var(--panel-2),#1C3550);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--text-dim);border-bottom:1px solid var(--line);}
  .vid-body{padding:12px 14px 14px;}
  .vid-body b{font-size:13.5px;display:block;margin-bottom:4px;}
  .vid-body p{font-size:12px;color:var(--text-dim);margin:0 0 8px;line-height:1.6;}
  .vid-meta{display:flex;justify-content:space-between;align-items:center;}
  .vid-level{font-size:10.5px;color:var(--text-dim);}
  .vid-link{font-size:12px;color:var(--ice);font-weight:700;text-decoration:none;}
  .check-tool{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .check-tool h3{margin:0 0 4px;font-size:16px;}
  .check-tool p.sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .qrow{margin-bottom:16px;}
  .qrow label{font-size:13.5px;color:var(--text);margin-bottom:8px;}
  .opt-row{display:flex;gap:8px;flex-wrap:wrap;}
  .opt-pill{border:1px solid var(--line);background:var(--panel-2);border-radius:20px;padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--text-dim);}
  .opt-pill.sel{border-color:var(--ice);background:var(--ice-dim);color:var(--ice);}
  .result-box{margin-top:18px;border-radius:11px;padding:16px;display:none;}
  .result-box.show{display:block;}
  .result-low{background:rgba(123,216,143,0.12);border:1px solid rgba(123,216,143,0.3);}
  .result-mid{background:var(--amber-dim);border:1px solid rgba(242,166,90,0.35);}
  .result-high{background:var(--coral-dim);border:1px solid rgba(255,111,111,0.35);}
  .result-box b{display:block;font-size:14px;margin-bottom:6px;}
  .result-box p{font-size:12.5px;line-height:1.7;margin:0;color:var(--text);opacity:.9;}
  .disclaimer{font-size:11px;color:var(--text-dim);margin-top:14px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px;}

  .admin-badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-dim);color:var(--amber);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;margin-bottom:16px;}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .stat-card .n{font-size:26px;font-weight:800;}
  .stat-card .l{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .form-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
  .form-card h3{margin:0 0 16px;font-size:15px;}
  .vid-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
  .vid-row:first-child{border-top:none;}
  .vid-row .t{font-size:13.5px;font-weight:600;}
  .vid-row .m{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .del-btn{background:none;border:1px solid var(--line);color:#FF9B9B;border-radius:8px;padding:6px 10px;font-size:11.5px;cursor:pointer;}
  .del-btn:hover{border-color:var(--coral);}
  .empty{color:var(--text-dim);font-size:13px;padding:14px 0;}
  .tabbar{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tabbar button{background:none;border:none;color:var(--text-dim);padding:10px 4px;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-right:14px;}
  .tabbar button.on{color:var(--ice);border-color:var(--ice);}
  @media(max-width:520px){
    .choice-grid{grid-template-columns:1fr 1fr;} .row2{grid-template-columns:1fr;}
    .vid-grid{grid-template-columns:1fr;} .admin-grid{grid-template-columns:1fr 1fr;}
    .lang-grid{grid-template-columns:1fr 1fr;}
  }
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none;">
  <div class="brand"><div><span class="logo" role="img" aria-label="Skate Lab">Skate&nbsp;<svg class="skate-l" viewBox="0 0 26 34" aria-hidden="true"><path d="M3 1.5Q3 0.5 4 0.5H10Q11 0.5 11 1.5V18.5H23Q26 18.5 26 21.5V24.5H3Z" fill="#FF7EB6"/><circle cx="7" cy="6" r="1" fill="#fff" opacity=".85"/><circle cx="7" cy="10" r="1" fill="#fff" opacity=".85"/><circle cx="7" cy="14" r="1" fill="#fff" opacity=".85"/><path d="M7 24.5V29M21 24.5V29" stroke="#4DA3FF" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M1.5 29.5H22Q25 29.5 25 26.5" stroke="#4DA3FF" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>ab</span><div class="sub" id="brand-sub"></div></div></div>
  <div class="userchip" id="userchip"></div>
</div>

<div class="app">

  <!-- ============ LANGUAGE SELECT ============ -->
  <section id="view-lang" class="lang-wrap">
    <div class="lang-hero">
      <h1 class="logo-xl"><span class="logo" role="img" aria-label="Skate Lab">Skate&nbsp;<svg class="skate-l" viewBox="0 0 26 34" aria-hidden="true"><path d="M3 1.5Q3 0.5 4 0.5H10Q11 0.5 11 1.5V18.5H23Q26 18.5 26 21.5V24.5H3Z" fill="#FF7EB6"/><circle cx="7" cy="6" r="1" fill="#fff" opacity=".85"/><circle cx="7" cy="10" r="1" fill="#fff" opacity=".85"/><circle cx="7" cy="14" r="1" fill="#fff" opacity=".85"/><path d="M7 24.5V29M21 24.5V29" stroke="#4DA3FF" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M1.5 29.5H22Q25 29.5 25 26.5" stroke="#4DA3FF" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>ab</span></h1>
      <p>Choose your language / 选择语言 / 選擇語言 / 言語を選択 / 언어 선택 / Choisissez votre langue / Elige tu idioma</p>
    </div>
    <div class="lang-grid" id="lang-grid"></div>
  </section>

  <!-- ============ AUTH ============ -->
  <section id="view-auth" class="auth-wrap hidden">
    <div class="auth-hero">
      <h1 id="auth-title"></h1>
      <p id="auth-sub"></p>
    </div>
    <div class="card auth-card">
      <div class="tabs">
        <div class="tab active" id="tab-signin" onclick="switchAuthTab('signin')"></div>
        <div class="tab" id="tab-signup" onclick="switchAuthTab('signup')"></div>
      </div>
      <div class="err-msg" id="auth-err"></div>

      <div id="form-signin">
        <div class="field"><label id="l-si-email"></label><input type="email" id="si-email"></div>
        <div class="field"><label id="l-si-pass"></label><input type="password" id="si-pass"></div>
        <button class="primary-btn" id="btn-si" onclick="handleSignIn()"></button>
      </div>

      <div id="form-signup" class="hidden">
        <div class="field"><label id="l-su-email"></label><input type="email" id="su-email"></div>
        <div class="field"><label id="l-su-pass"></label><input type="password" id="su-pass"></div>
        <div class="field"><label id="l-su-pass2"></label><input type="password" id="su-pass2"></div>
        <button class="primary-btn" id="btn-su" onclick="handleSignUp()"></button>
      </div>
      <div class="hint" id="auth-hint"></div>
    </div>
    <button class="langswitch-btn" style="margin-top:18px;" onclick="backToLang()" id="btn-change-lang"></button>
  </section>

  <!-- ============ ONBOARDING ============ -->
  <section id="view-onboard" class="hidden">
    <div class="card" style="max-width:460px;margin:0 auto;">
      <div class="onb-progress"><i id="pg-1" class="on"></i><i id="pg-2"></i><i id="pg-3"></i><i id="pg-4"></i></div>

      <div class="onb-step" id="step-1">
        <h2 id="onb1-title"></h2><p class="sub" id="onb1-sub"></p>
        <div class="choice-grid" id="referral-grid"></div>
      </div>

      <div class="onb-step hidden" id="step-2">
        <h2 id="onb2-title"></h2><p class="sub" id="onb2-sub"></p>
        <div class="field"><label id="l-ob-nick"></label><input type="text" id="ob-nick"></div>
        <label id="l-ob-avatar"></label>
        <div class="avatar-grid" id="avatar-grid"></div>
      </div>

      <div class="onb-step hidden" id="step-3">
        <h2 id="onb3-title"></h2><p class="sub" id="onb3-sub"></p>
        <div class="row2">
          <div class="field"><label id="l-ob-age"></label><input type="number" id="ob-age" min="4" max="80"></div>
          <div class="field"><label id="l-ob-gender"></label><select id="ob-gender"></select></div>
        </div>
        <div class="row2">
          <div class="field"><label id="l-ob-height"></label><input type="number" id="ob-height"></div>
          <div class="field"><label id="l-ob-weight"></label><input type="number" id="ob-weight"></div>
        </div>
      </div>

      <div class="onb-step hidden" id="step-4">
        <h2 id="onb4-title"></h2><p class="sub" id="onb4-sub"></p>
        <div class="choice-grid" id="exp-grid"></div>
      </div>

      <div class="err-msg" id="onb-err"></div>
      <div class="onb-nav">
        <button class="ghost-btn hidden" id="onb-back" onclick="onbBack()"></button>
        <button class="primary-btn" id="onb-next" onclick="onbNext()" style="flex:1;"></button>
      </div>
    </div>
  </section>

  <!-- ============ USER DASHBOARD ============ -->
  <section id="view-dash" class="hidden">
    <div class="hello"><span id="hello-prefix"></span><span class="em" id="dash-nick"></span> <span id="dash-avatar"></span></div>
    <div class="datestr" id="dash-date"></div>

    <div class="section-title"><h3 id="today-goals-title"></h3><span id="goal-progress-label"></span></div>
    <div class="goal-card"><div id="goal-list"></div></div>

    <div class="section-title"><h3 id="self-check-title"></h3><span id="self-check-note"></span></div>
    <div class="check-tool">
      <h3 id="check-card-title"></h3><p class="sub" id="check-card-sub"></p>
      <div class="qrow"><label id="l-q-pain"></label><div class="opt-row" data-q="pain" id="opt-pain"></div></div>
      <div class="qrow"><label id="l-q-swell"></label><div class="opt-row" data-q="swell" id="opt-swell"></div></div>
      <div class="qrow"><label id="l-q-mobility"></label><div class="opt-row" data-q="mobility" id="opt-mobility"></div></div>
      <button class="primary-btn" id="btn-view-result" onclick="runCheck()"></button>
      <div class="result-box" id="check-result"></div>
      <div class="disclaimer" id="disclaimer-text"></div>
    </div>

    <div class="section-title"><h3 id="recommended-videos-title"></h3><span id="vid-count-label"></span></div>
    <div class="vid-grid" id="vid-grid"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="view-settings" class="hidden">
    <div class="card" style="max-width:460px;margin:0 auto;">
      <h2 id="set-title" style="font-size:19px;margin:0 0 4px;"></h2>
      <p class="sub" id="set-sub" style="color:var(--text-dim);font-size:13px;margin:0 0 20px;"></p>

      <label id="l-set-lang"></label>
      <select id="set-lang" style="margin-bottom:14px;"></select>

      <div class="field"><label id="l-set-nick"></label><input type="text" id="set-nick"></div>

      <label id="l-set-avatar"></label>
      <div class="avatar-grid" id="set-avatar-grid" style="margin-bottom:14px;"></div>

      <div class="row2">
        <div class="field"><label id="l-set-age"></label><input type="number" id="set-age" min="4" max="80"></div>
        <div class="field"><label id="l-set-gender"></label><select id="set-gender"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label id="l-set-height"></label><input type="number" id="set-height"></div>
        <div class="field"><label id="l-set-weight"></label><input type="number" id="set-weight"></div>
      </div>

      <div class="field"><label id="l-set-exp"></label><select id="set-exp"></select></div>

function seedVideosIfEmpty(){
  // Only ever seeds the demo videos ONCE per browser (tracked by fsl_videos_seeded).
  // After that, the stored video list is authoritative: adding/deleting videos in
  // admin persists exactly as-is on reopen — never re-added, never silently reset.
  const alreadySeeded = getJSON(LS.videosSeeded, false);
  if (alreadySeeded) return;
  const src = T[currentLang || 'en'].seedVideos;
  setJSON(LS.videos, src.map((sv,i)=>({id:'v'+(i+1), title:sv.title, cat:sv.cat, level:sv.level, url:'', desc:sv.desc, addedAt:Date.now()})));
  setJSON(LS.videosSeeded, true);
}

function switchAuthTab(which){
  document.getElementById('tab-signin').classList.toggle('active', which==='signin');
  document.getElementById('tab-signup').classList.toggle('active', which==='signup');
  document.getElementById('form-signin').classList.toggle('hidden', which!=='signin');
  document.getElementById('form-signup').classList.toggle('hidden', which!=='signup');
  hideAuthErr();
}
function showAuthErr(msg){ const e=document.getElementById('auth-err'); e.textContent=msg; e.classList.add('show'); }
function hideAuthErr(){ document.getElementById('auth-err').classList.remove('show'); }

function handleSignIn(){
  hideAuthErr();
  const email = document.getElementById('si-email').value.trim();
  const pass = document.getElementById('si-pass').value;
  if(!email || !pass){ showAuthErr(t('err_fill_login')); return; }
  if(email.toLowerCase() === ADMIN_EMAIL && pass === ADMIN_PASS){
    setJSON(LS.session, {email: email.toLowerCase(), isAdmin:true});
    enterAdmin(); return;
  }
  const accounts = getJSON(LS.accounts, {});
  const acct = accounts[email.toLowerCase()];
  if(!acct || acct.password !== pass){ showAuthErr(t('err_wrong_credentials')); return; }
  setJSON(LS.session, {email: email.toLowerCase(), isAdmin:false});
  if(acct.profile && acct.profile.done){ enterDash(); } else { startOnboarding(); }
}
function handleSignUp(){
  hideAuthErr();
  const email = document.getElementById('su-email').value.trim();
  const pass = document.getElementById('su-pass').value;
  const pass2 = document.getElementById('su-pass2').value;
  if(!email || !pass){ showAuthErr(t('err_fill_signup')); return; }
  if(pass.length < 6){ showAuthErr(t('err_password_short')); return; }
  if(pass !== pass2){ showAuthErr(t('err_password_mismatch')); return; }
  if(email.toLowerCase() === ADMIN_EMAIL){ showAuthErr(t('err_admin_blocked')); return; }
  const accounts = getJSON(LS.accounts, {});
  if(accounts[email.toLowerCase()]){ showAuthErr(t('err_already_registered')); return; }
  accounts[email.toLowerCase()] = { password: pass, createdAt: Date.now(), referral:'', profile:{done:false} };
  setJSON(LS.accounts, accounts);
  setJSON(LS.session, {email: email.toLowerCase(), isAdmin:false});
  startOnboarding();
}

  document.getElementById('ob-height').value=''; document.getElementById('ob-weight').value='';
  buildAvatarGrid();
  renderOnbStep();

}
function buildAvatarGrid(){
  const avatars = ['⛸️','🩰','❄️','🏅','⭐','🦢','💪','🔥','🧊','🎽','🥇','✨'];
  const grid = document.getElementById('avatar-grid');
  grid.innerHTML = avatars.map(a=>`<div class="avatar-opt" data-v="${a}">${a}</div>`).join('');
  grid.onclick = e=>{ const c = e.target.closest('.avatar-opt'); if(!c) return;
    grid.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); onbData.avatar = c.dataset.v; };
}
function renderOnbStep(){
  for(let i=1;i<=4;i++){
    document.getElementById('step-'+i).classList.toggle('hidden', i!==onbStep);
    document.getElementById('pg-'+i).classList.toggle('on', i<=onbStep);
  }
  document.getElementById('onb-back').classList.toggle('hidden', onbStep===1);
  document.getElementById('onb-next').textContent = onbStep===4 ? t('onb_finish') : t('onb_next');
  document.getElementById('onb-err').classList.remove('show');
}
function onbErr(msg){ const e=document.getElementById('onb-err'); e.textContent=msg; e.classList.add('show'); }
function onbNext(){
  if(onbStep===1 && !onbData.referral){ onbErr(t('onb_err_referral')); return; }
  if(onbStep===2){
    onbData.nick = document.getElementById('ob-nick').value.trim();
    if(!onbData.nick){ onbErr(t('onb_err_nickname')); return; }
  }
  if(onbStep===3){
    onbData.age = document.getElementById('ob-age').value;
    onbData.genderIdx = document.getElementById('ob-gender').value;
    onbData.height = document.getElementById('ob-height').value;
    onbData.weight = document.getElementById('ob-weight').value;
    if(!onbData.age || !onbData.height || !onbData.weight){ onbErr(t('onb_err_physical')); return; }
  }
  if(onbStep===4){
    if(!onbData.exp){ onbErr(t('onb_err_exp')); return; }
    finishOnboarding(); return;
  }
  onbStep++; renderOnbStep();
}
function onbBack(){ if(onbStep>1){ onbStep--; renderOnbStep(); } }
function finishOnboarding(){
  const session = getJSON(LS.session, null); if(!session) return;
  const accounts = getJSON(LS.accounts, {});
  const acct = accounts[session.email]; if(!acct) return;
  acct.referral = onbData.referral; acct.lang = currentLang;
  acct.profile = { done:true, nick:onbData.nick, avatar:onbData.avatar, age:onbData.age,
    genderIdx:onbData.genderIdx, height:onbData.height, weight:onbData.weight, exp:onbData.exp };
  accounts[session.email] = acct;
  setJSON(LS.accounts, accounts);
  enterDash();
}

/* ---------------- goal generation ---------------- */
function seededRand(seed){ let x = Math.sin(seed) * 10000; return x - Math.floor(x); }
function dayIndex(){ return Math.floor(new Date().getTime()/86400000); }
function generateGoals(profile){
  const pool = t('goals');
  const seed = dayIndex() + (profile.nick ? profile.nick.length : 0);
  const pick = (arr, s) => arr[Math.floor(seededRand(s)*arr.length)];
  const tag = t('goal_tag');
  const goals = [
    {catKey:'warm', tag:tag.warm, cls:'tag-warm', ...pick(pool.warm, seed+1)},
    {catKey:'strength', tag:tag.strength, cls:'tag-strength', ...pick(pool.strength, seed+2)},
    {catKey:'recover', tag:tag.recover, cls:'tag-recover', ...pick(pool.recover, seed+3)},
    {catKey:'safety', tag:tag.safety, cls:'tag-safety', ...pick(pool.safety, seed+4)}
  ];
  if(profile.exp==='3-6年' || profile.exp==='6年以上'){
    goals.push({catKey:'strength', tag:tag.strength, cls:'tag-strength', ...pick(pool.strength, seed+5)});
  }
  return goals;
}

/* ---------------- dashboard ---------------- */
function currentAccount(){
  const s = getJSON(LS.session, null); if(!s) return null;
  const accounts = getJSON(LS.accounts, {});
  return accounts[s.email] || null;
}
function enterDash(){
  const acct = currentAccount();
  if(!acct || !acct.profile || !acct.profile.done){ startOnboarding(); return; }
  const p = acct.profile;
  document.getElementById('dash-nick').textContent = p.nick;
  document.getElementById('dash-avatar').textContent = p.avatar;
  document.getElementById('dash-date').textContent = new Date().toLocaleDateString(currentLang, {year:'numeric',month:'long',day:'numeric',weekday:'long'});
  document.getElementById('userchip').innerHTML = `<div class="avatar-badge">${p.avatar}</div><span>${p.nick}</span><button class="logout-btn" onclick="openSettings()">${t('btn_settings')}</button><button class="logout-btn" onclick="logout()">${t('logout')}</button>`;
  renderGoals(p);
  renderVideos(p);
  showView('view-dash');
}

/* ---------------- settings ---------------- */
function buildSettingsSelect(id, options, selectedIdx){
  document.getElementById(id).innerHTML = options.map((o,i)=>`<option value="${i}" ${i===Number(selectedIdx)?'selected':''}>${o}</option>`).join('');
}
function openSettings(){
  const acct = currentAccount();
  if(!acct || !acct.profile) return;
  const p = acct.profile;

  document.getElementById('set-title').textContent = t('settings_title');
  document.getElementById('set-sub').textContent = t('settings_sub');
  document.getElementById('l-set-lang').textContent = t('l_set_lang');
  document.getElementById('set-lang').innerHTML = LANGS.map(l=>`<option value="${l.code}" ${l.code===currentLang?'selected':''}>${l.native}</option>`).join('');
  document.getElementById('l-set-nick').textContent = t('l_nickname');
  document.getElementById('set-nick').value = p.nick || '';
  document.getElementById('l-set-avatar').textContent = t('l_avatar');
  const avatars = ['⛸️','🩰','❄️','🏅','⭐','🦢','💪','🔥','🧊','🎽','🥇','✨'];
  const ag = document.getElementById('set-avatar-grid');
  ag.innerHTML = avatars.map(a=>`<div class="avatar-opt ${a===p.avatar?'sel':''}" data-v="${a}">${a}</div>`).join('');
  ag.onclick = e=>{ const c = e.target.closest('.avatar-opt'); if(!c) return;
    ag.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); };

  document.getElementById('l-set-age').textContent = t('l_age');
  document.getElementById('set-age').value = p.age || '';
  document.getElementById('l-set-gender').textContent = t('l_gender');
  buildSettingsSelect('set-gender', t('gender'), p.genderIdx || 0);
  document.getElementById('l-set-height').textContent = t('l_height');
  document.getElementById('set-height').value = p.height || '';
  document.getElementById('l-set-weight').textContent = t('l_weight');
  document.getElementById('set-weight').value = p.weight || '';

  document.getElementById('l-set-exp').textContent = t('onb4_title');
  const expIdx = LEVEL_KEYS.indexOf(p.exp); 
  buildSettingsSelect('set-exp', t('exp'), expIdx>=0?expIdx:0);

  document.getElementById('l-set-jump').textContent = t('l_hardest_jump');
  buildSettingsSelect('set-jump', t('jump'), p.jumpIdx || 0);
  document.getElementById('l-set-spin').textContent = t('l_spin_level');
  buildSettingsSelect('set-spin', t('spin'), p.spinIdx || 0);
  document.getElementById('l-set-comp').textContent = t('l_competitive_level');
  buildSettingsSelect('set-comp', t('comp'), p.compIdx || 0);
  document.getElementById('l-set-fieldtest').textContent = t('l_field_test');
  const fieldTestOptions = [t('field_test_not_started')].concat(FIELD_TEST_LEVELS);
  buildSettingsSelect('set-fieldtest', fieldTestOptions, p.fieldTestIdx || 0);

  document.getElementById('btn-set-back').textContent = t('btn_back_dash');
  document.getElementById('btn-set-save').textContent = t('btn_save');
  document.getElementById('set-err').classList.remove('show');

  showView('view-settings');
}
function cancelSettings(){ enterDash(); }
function saveSettings(){
  const session = getJSON(LS.session, null); if(!session) return;
  const accounts = getJSON(LS.accounts, {});
  const acct = accounts[session.email]; if(!acct) return;

  const nick = document.getElementById('set-nick').value.trim();
  const age = document.getElementById('set-age').value;
  const height = document.getElementById('set-height').value;
  const weight = document.getElementById('set-weight').value;
  if(!nick || !age || !height || !weight){
    const e = document.getElementById('set-err'); e.textContent = t('onb_err_physical'); e.classList.add('show'); return;
  }
  const avatarEl = document.querySelector('#set-avatar-grid .avatar-opt.sel');

  const newLang = document.getElementById('set-lang').value;
  const expIdx = Number(document.getElementById('set-exp').value);

  acct.profile = {
    done:true,
    nick, avatar: avatarEl ? avatarEl.dataset.v : (acct.profile.avatar || '⛸️'),
    age, genderIdx: document.getElementById('set-gender').value,
    height, weight,
    exp: LEVEL_KEYS[expIdx] || acct.profile.exp,
    jumpIdx: document.getElementById('set-jump').value,
    spinIdx: document.getElementById('set-spin').value,
    compIdx: document.getElementById('set-comp').value,
    fieldTestIdx: document.getElementById('set-fieldtest').value
  };
  accounts[session.email] = acct;
  setJSON(LS.accounts, accounts);

  if(newLang !== currentLang){
    currentLang = newLang;
    setJSON(LS.lang, newLang);
    applyStaticText();
  }
  enterDash();
}
function goalStorageKey(){ const s = getJSON(LS.session, null); return 'fsl_goalstate_' + s.email + '_' + dayIndex(); }
function renderGoals(p){
  const goals = generateGoals(p);
  const state = getJSON(goalStorageKey(), {});
  const list = document.getElementById('goal-list');
  list.innerHTML = goals.map((g,i)=>{
    const done = !!state[i];
    return `<div class="goal-item">
      <div class="goal-check ${done?'done':''}" onclick="toggleGoal(${i})">${done?'✓':''}</div>
      <div class="goal-body"><b>${g.t}</b><p>${g.d}</p><span class="goal-tag ${g.cls}">${g.tag}</span></div>
    </div>`;
  }).join('');
  const doneCount = goals.filter((g,i)=>state[i]).length;
  document.getElementById('goal-progress-label').textContent = t('goal_progress_tpl').replace('{done}',doneCount).replace('{total}',goals.length);
}
function toggleGoal(i){
  const key = goalStorageKey(); const state = getJSON(key, {});
  state[i] = !state[i]; setJSON(key, state);
  const acct = currentAccount(); renderGoals(acct.profile);
}
function renderVideos(p){
  const videos = getJSON(LS.videos, []);
  const recommended = videos.filter(v => v.level==='全部' || v.level===p.exp);
  const rest = videos.filter(v => !(v.level==='全部' || v.level===p.exp));
  const ordered = recommended.concat(rest);
  document.getElementById('vid-count-label').textContent = t('vid_count_tpl').replace('{n}', recommended.length);
  const levelLabel = (lvl)=>{
    if(lvl==='全部') return t('level_all');
    const idx = LEVEL_KEYS.indexOf(lvl);
    return idx>=0 ? t('exp')[idx] : lvl;
  };
  document.getElementById('vid-grid').innerHTML = ordered.map(v=>`
    <div class="vid-card">
      <div class="vid-thumb">${CAT_ICON[v.cat]||'🎬'}</div>
      <div class="vid-body">
        <b>${v.title}</b><p>${v.desc||''}</p>
        <div class="vid-meta">
          <span class="vid-level">${t('cat')[v.cat]||v.cat} · ${levelLabel(v.level)}</span>
          ${v.url ? `<a class="vid-link" href="${v.url}" target="_blank" rel="noopener">${t('watch_link')}</a>` : `<span class="vid-link" style="opacity:.4;">${t('coming_soon')}</span>`}
        </div>
      </div>
    </div>`).join('');
}

/* ---------------- self-check ---------------- */
const checkAnswers = {pain:null, swell:null, mobility:null};
document.addEventListener('click', e=>{
  const row = e.target.closest('.opt-row'); if(!row) return;
  const pill = e.target.closest('.opt-pill'); if(!pill) return;
  const q = row.dataset.q;
  row.querySelectorAll('.opt-pill').forEach(p=>p.classList.remove('sel'));
  pill.classList.add('sel');
  checkAnswers[q] = parseInt(pill.dataset.v,10);
});
function runCheck(){
  if(checkAnswers.pain===null || checkAnswers.swell===null || checkAnswers.mobility===null){
    alert(t('onb_err_physical')); return;
  }
  const score = checkAnswers.pain + checkAnswers.swell + checkAnswers.mobility;
  const box = document.getElementById('check-result');
  box.classList.remove('result-low','result-mid','result-high');
  let cls, title, body;
  if(score<=1){ cls='result-low'; title=t('result_low_title'); body=t('result_low_body'); }
  else if(score<=4){ cls='result-mid'; title=t('result_mid_title'); body=t('result_mid_body'); }
  else { cls='result-high'; title=t('result_high_title'); body=t('result_high_body'); }
  box.classList.add(cls, 'show');
  box.innerHTML = `<b>${title}</b><p>${body}</p>`;
}

/* ---------------- admin ---------------- */
function enterAdmin(){
  document.getElementById('userchip').innerHTML = `<div class="avatar-badge">⚙</div><span>Admin</span><button class="logout-btn" onclick="logout()">${t('logout')}</button>`;
  renderAdmin();
  showView('view-admin');
}
function switchAdminTab(which){
  ['videos','feature','users'].forEach(tb=>{
    document.getElementById('atab-'+tb).classList.toggle('on', tb===which);
    document.getElementById('apanel-'+tb).classList.toggle('hidden', tb!==which);
  });
}
function renderAdmin(){
  const videos = getJSON(LS.videos, []);
  const accounts = getJSON(LS.accounts, {});
  const features = getJSON(LS.features, []);
  document.getElementById('ad-vidcount').textContent = videos.length;
  document.getElementById('ad-usercount').textContent = Object.keys(accounts).length;

  document.getElementById('admin-vid-list').innerHTML = videos.length ? videos.slice().reverse().map(v=>`
    <div class="vid-row"><div><div class="t">${v.title}</div><div class="m">${t('cat')[v.cat]||v.cat} · ${v.level}</div></div>
    <button class="del-btn" onclick="deleteVideo('${v.id}')">${t('btn_delete')}</button></div>`).join('') : `<div class="empty">${t('empty_videos')}</div>`;

  document.getElementById('admin-feature-list').innerHTML = features.length ? features.slice().reverse().map(f=>`
    <div class="vid-row"><div><div class="t">${f.title}</div><div class="m">${new Date(f.addedAt).toLocaleDateString(currentLang)}</div></div>
    <button class="del-btn" onclick="deleteFeature('${f.id}')">${t('btn_delete')}</button></div>`).join('') : `<div class="empty">${t('empty_features')}</div>`;

  const accEntries = Object.entries(accounts);
  document.getElementById('admin-user-list').innerHTML = accEntries.length ? accEntries.map(([email,a])=>`
    <div class="vid-row"><div><div class="t">${a.profile && a.profile.nick ? a.profile.nick : email}</div>
    <div class="m">${email} · ${t('source_label')}: ${a.referral||'-'} · ${t('level_label')}: ${(a.profile&&a.profile.exp)? (t('exp')[LEVEL_KEYS.indexOf(a.profile.exp)]||a.profile.exp) : t('profile_incomplete')}</div></div></div>`).join('') : `<div class="empty">${t('empty_users')}</div>`;
}
function addVideo(){
  const title = document.getElementById('av-title').value.trim();
  if(!title){ alert(t('l_title')); return; }
  const videos = getJSON(LS.videos, []);
  videos.push({ id:'v'+Date.now(), title, cat: document.getElementById('av-cat').value, level: document.getElementById('av-level').value,
    url: document.getElementById('av-url').value.trim(), desc: document.getElementById('av-desc').value.trim(), addedAt: Date.now() });
  setJSON(LS.videos, videos);
  document.getElementById('av-title').value=''; document.getElementById('av-url').value=''; document.getElementById('av-desc').value='';
  renderAdmin();
}
function deleteVideo(id){ let videos = getJSON(LS.videos, []); videos = videos.filter(v=>v.id!==id); setJSON(LS.videos, videos); renderAdmin(); }
function addFeature(){
  const title = document.getElementById('af-title').value.trim();
  const body = document.getElementById('af-body').value.trim();
  if(!title){ alert(t('l_feature_title')); return; }
  const features = getJSON(LS.features, []);
  features.push({id:'f'+Date.now(), title, body, addedAt:Date.now()});
  setJSON(LS.features, features);
  document.getElementById('af-title').value=''; document.getElementById('af-body').value='';
  renderAdmin();
}
function deleteFeature(id){ let features = getJSON(LS.features, []); features = features.filter(f=>f.id!==id); setJSON(LS.features, features); renderAdmin(); }

/* ---------------- boot ---------------- */
(function boot(){
  buildLangGrid();
  if(!currentLang){ showView('view-lang'); return; }
  seedVideosIfEmpty();
  applyStaticText();
  const session = getJSON(LS.session, null);
  if(!session){ showView('view-auth'); return; }
  if(session.isAdmin){ enterAdmin(); return; }
  const acct = currentAccount();
  if(acct && acct.profile && acct.profile.done){ enterDash(); }
  else if(acct){ startOnboarding(); }
  else { showView('view-auth'); }
})();
</script>
